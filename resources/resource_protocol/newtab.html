<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новая вкладка</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#141415;color:#ededed;font:14px Arial,sans-serif}
header{height:112px;padding:32px 48px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-size:15px;color:#a1a1a6}.mark{color:#f77043;font-size:26px;line-height:1;font-weight:500}
.time{text-align:right}#clock{font-size:32px;line-height:36px;font-weight:400;font-variant-numeric:tabular-nums}#date{color:#85858b;font-size:12px;line-height:20px}
main{width:760px;max-width:calc(100% - 64px);margin:64px auto 120px}.context{color:#85858b;font-size:13px;margin:0 0 12px}h1{font-size:32px;line-height:40px;font-weight:500;letter-spacing:-.5px;margin:0 0 24px}
form{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 20px;background:#232325;border:1px solid #37373b;border-radius:12px}form:focus-within{border-color:#85858b}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}.search-icon{color:#a1a1a6}
input{width:100%;min-width:0;height:40px;border:0;outline:0;background:transparent;color:#ededed;font:16px Arial,sans-serif}input::placeholder{color:#a1a1a6}button{display:flex;align-items:center;justify-content:center;flex:none;width:40px;height:40px;background:#ededed;color:#171717;border:0;border-radius:6px;cursor:pointer}button:hover{background:#fff}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:40px 0 12px;color:#a1a1a6;font-size:13px}.section-title span:last-child{font-size:12px;color:#85858b}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}nav a{display:flex;flex-direction:column;justify-content:space-between;height:120px;padding:20px;text-decoration:none;background:#19191b;border:1px solid #2c2c2f;border-radius:12px;color:#ededed;transition:background-color .14s ease,border-color .14s ease}nav a:hover{background:#232325;border-color:#4a4a50}
.site-icon{display:flex;align-items:center;justify-content:center;width:32px;height:32px}.site-icon svg{width:28px;height:28px}.wiki{font:30px Georgia,serif}.yandex{font:28px Arial,sans-serif;color:#ed4c42}.youtube{color:#ee5147}.site-label{display:flex;justify-content:space-between;align-items:center;font-size:13px}.site-label svg{width:14px;height:14px;color:#85858b}
footer{position:fixed;left:48px;right:48px;bottom:28px;display:flex;justify-content:space-between;gap:20px;color:#85858b;font-size:12px}.keys{display:flex;gap:20px}.keys span{display:flex;align-items:center;gap:8px}kbd{padding:4px 6px;line-height:16px;border:1px solid #37373b;border-radius:4px;background:#19191b;font:11px Arial,sans-serif;color:#a1a1a6}
@media(max-width:760px){header{padding:24px 32px;height:96px}main{margin-top:32px}h1{font-size:28px}nav{grid-template-columns:repeat(2,1fr)}nav a{height:100px;padding:16px}footer{position:static;margin:40px 32px 24px;display:block}.keys{margin-top:16px;flex-wrap:wrap}.section-title span:last-child{display:none}}@media(prefers-reduced-motion:reduce){nav a{transition:none}}
</style></head><body>
<header><div class="brand"><img width="28" height="28" alt="" src="resource:/logo.png"><span>Rust Browser</span></div><div class="time"><div id="clock"></div><div id="date"></div></div></header>
<main><p class="context">Новая вкладка</p><h1>Поиск в интернете</h1>
<form action="https://search.brave.com/search" method="get"><svg fill="none" stroke="#a1a1a6" stroke-width="1.5" class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle fill="none" stroke="#a1a1a6" stroke-width="1.5" cx="10.5" cy="10.5" r="6.5"/><path fill="none" stroke="#a1a1a6" stroke-width="1.5" d="m16 16 5 5"/></svg><input name="q" aria-label="Поиск в Brave Search" placeholder="Запрос для Brave Search" autocomplete="off"><button type="submit" aria-label="Найти"><svg fill="none" stroke="#85858b" stroke-width="1.5" viewBox="0 0 24 24"><path fill="none" stroke="#a1a1a6" stroke-width="1.5" d="M5 12h14m-6-6 6 6-6 6"/></svg></button></form>
<div class="section-title"><span>Быстрый доступ</span><span>Открыть сайт</span></div>
<nav aria-label="Быстрый доступ">
<a href="https://www.youtube.com/"><span class="site-icon youtube"><svg fill="none" stroke="#85858b" stroke-width="1.5" viewBox="0 0 24 24" fill="#ee5147" stroke="none"><rect fill="#ee5147" stroke="none" x="2" y="5" width="20" height="14" rx="4"/><path fill="none" stroke="#a1a1a6" stroke-width="1.5" d="m10 9 6 3-6 3z" style="fill:#19191b;stroke:none"/></svg></span><span class="site-label">YouTube<svg fill="none" stroke="#85858b" stroke-width="1.5" viewBox="0 0 24 24"><path fill="none" stroke="#a1a1a6" stroke-width="1.5" d="M7 17 17 7M7 7h10v10"/></svg></span></a>
<a href="https://ru.wikipedia.org/"><span class="site-icon wiki">W</span><span class="site-label">Википедия<svg fill="none" stroke="#85858b" stroke-width="1.5" viewBox="0 0 24 24"><path fill="none" stroke="#a1a1a6" stroke-width="1.5" d="M7 17 17 7M7 7h10v10"/></svg></span></a>
<a href="https://github.com/"><span class="site-icon"><svg fill="none" stroke="#85858b" stroke-width="1.5" viewBox="0 0 24 24"><path fill="none" stroke="#a1a1a6" stroke-width="1.5" d="M9 19c-4 1-4-2-6-2m12 4v-4c0-1 .1-1.5-.5-2 3-.3 5.5-1.5 5.5-5.5 0-1.2-.4-2.2-1.2-3 .1-1 .1-2-.3-3-1 0-2 .4-3 1-2-.5-4-.5-6 0-1-.6-2-1-3-1-.4 1-.4 2-.3 3C5.4 7.3 5 8.3 5 9.5c0 4 2.5 5.2 5.5 5.5-.6.5-.5 1-.5 2v4"/></svg></span><span class="site-label">GitHub<svg fill="none" stroke="#85858b" stroke-width="1.5" viewBox="0 0 24 24"><path fill="none" stroke="#a1a1a6" stroke-width="1.5" d="M7 17 17 7M7 7h10v10"/></svg></span></a>
<a href="https://ya.ru/"><span class="site-icon yandex">Я</span><span class="site-label">Яндекс<svg fill="none" stroke="#85858b" stroke-width="1.5" viewBox="0 0 24 24"><path fill="none" stroke="#a1a1a6" stroke-width="1.5" d="M7 17 17 7M7 7h10v10"/></svg></span></a>
</nav></main><footer><span>Rust Browser · Servo</span><div class="keys"><span><kbd>Ctrl L</kbd>Адрес</span><span><kbd>Ctrl T</kbd>Вкладка</span><span><kbd>Ctrl D</kbd>Закладка</span></div></footer>
<script>function clock(){var d=new Date();document.getElementById('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);document.getElementById('date').textContent=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});}clock();setInterval(clock,10000);</script>
</body></html>
