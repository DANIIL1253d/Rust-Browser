[package]
name = "rust-browser-core"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
csv = "1.3"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }
